# Webwright sidecar default configuration
#
# These values are overridden at runtime by the environment variables passed in
# the input.json payload from WebwrightSidecarService.ts.

[sidecar]
timeout_seconds = 180
max_repair_attempts = 2
headless = true
screenshot_on_complete = true

[security]
# Restrict which domains the browser may navigate to (comma-separated).
# Empty means no additional domain restriction at this level.
allowed_domains =
# Never log values that match these key name patterns.
secret_key_patterns = key,token,password,secret,auth
