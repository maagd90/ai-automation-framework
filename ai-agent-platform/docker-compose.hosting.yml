version: '3.9'

# Slim hosting profile: API + UI only (no Postgres/Redis/MinIO).
# Usage: docker compose -f docker-compose.hosting.yml up --build -d

services:
  agent-api:
    build:
      context: ..
      dockerfile: ai-agent-platform/Dockerfile.api
    shm_size: '1gb'
    environment:
      PORT: 3001
      JOBS_DIR: /tmp/jobs
      EPHEMERAL_SESSIONS: 'true'
      FORCE_HEADLESS: 'true'
      MVP_MODE: 'true'
      MAX_PARALLEL_AGENTS: '1'
      MAX_CONCURRENT_JOBS: '1'
      MAX_JOBS_PER_IP_PER_HOUR: '3'
      SESSION_RETENTION_MS: '900000'
      ALLOWED_ORIGINS: https://your-domain.com
      API_KEY: ${API_KEY:-}
    tmpfs:
      - /tmp/jobs:size=512M,mode=1777
    expose:
      - '3001'

  agent-ui:
    build:
      context: ..
      dockerfile: ai-agent-platform/Dockerfile.ui
      args:
        VITE_API_URL: /api
        VITE_FORCE_HEADLESS: 'true'
    depends_on:
      - agent-api
    expose:
      - '80'

  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - agent-api
      - agent-ui

volumes:
  caddy_data:
  caddy_config:
