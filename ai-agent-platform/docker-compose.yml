version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiagent
      POSTGRES_PASSWORD: aiagent
      POSTGRES_DB: aiagent
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  agent-api:
    build:
      context: ..
      dockerfile: ai-agent-platform/Dockerfile.api
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      DATABASE_URL: postgres://aiagent:aiagent@postgres:5432/aiagent
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - job_data:/tmp/jobs
    shm_size: '1gb'
    # For RAM-backed ephemeral workspace, use docker-compose.deploy.yml tmpfs instead.

  agent-ui:
    build:
      context: ..
      dockerfile: ai-agent-platform/Dockerfile.ui
    ports:
      - '3000:80'
    depends_on:
      - agent-api

volumes:
  postgres_data:
  minio_data:
  job_data:
