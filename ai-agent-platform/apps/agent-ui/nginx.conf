server {
    listen 5173;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — any path that does not match a static file is served as
    # index.html so that React Router can handle client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the API container.
    # The Docker Compose service named "api" is reachable by its service name
    # inside the shared Docker network.  The /api prefix is forwarded as-is
    # because the Express API mounts all routes under /api.
    location /api {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
