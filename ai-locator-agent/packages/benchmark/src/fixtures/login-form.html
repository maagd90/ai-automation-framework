<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Login</title></head>
<body>
  <form id="login-form">
    <label for="email">Email</label>
    <input id="email" type="email" name="email" data-testid="email-input" placeholder="Enter email" />
    <label for="password">Password</label>
    <input id="password" type="password" name="password" data-testid="password-input" placeholder="Enter password" />
    <button type="submit" data-testid="submit-btn">Sign In</button>
  </form>
</body>
</html>
